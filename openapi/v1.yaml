openapi: 3.1.0
info:
  title: registerwatch
  description: Gambling regulators' public registers, one schema per register, with history.
  contact:
    name: registerwatch
    url: https://github.com/mishmish004/RegisterWatch
  license:
    name: All rights reserved
    url: https://choosealicense.com/no-permission/
  version: 0.2.0
servers:
- url: /
  description: The deployment serving this document
paths:
  /v1/jurisdictions:
    get:
      tags:
      - jurisdictions
      summary: List jurisdictions
      operationId: listJurisdictions
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/jurisdictions/{code}:
    get:
      tags:
      - jurisdictions
      summary: Get a jurisdiction with its registers and their freshness
      operationId: getJurisdiction
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
          examples:
          - ch
          title: Code
        description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionDetail'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/registers:
    get:
      tags:
      - registers
      summary: List registers
      operationId: listRegisters
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/registers/{slug}:
    get:
      tags:
      - registers
      summary: Get a register with its tables and freshness
      operationId: getRegister
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDetail'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/registers/{slug}/tables/{table}:
    get:
      tags:
      - registers
      summary: Get a table's columns
      operationId: getTable
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: table
        in: path
        required: true
        schema:
          type: string
          description: Table name within the register
          examples:
          - licences
          title: Table
        description: Table name within the register
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSchema'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/registers/{slug}/tables/{table}/rows:
    get:
      tags:
      - rows
      summary: List a table's current rows
      operationId: listRows
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: table
        in: path
        required: true
        schema:
          type: string
          description: Table name within the register
          examples:
          - licences
          title: Table
        description: Table name within the register
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: Case-insensitive substring in any text column
          title: Q
        description: Case-insensitive substring in any text column
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 100
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: Also count every matching row (slower)
          default: false
          title: Include Total
        description: Also count every matching row (slower)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: filter
        in: query
        style: deepObject
        explode: true
        required: false
        description: Exact match on a column, e.g. `filter[status]=Active&filter[type]=Remote`. Columns
          are listed by getTable; any other column is a 400.
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowPage'
        '400':
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/search:
    get:
      tags:
      - search
      summary: Find text in every register's current rows
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 200
          description: Case-insensitive substring
          title: Q
        description: Case-insensitive substring
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
          title: Jurisdiction
        description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Rows returned per table
          default: 20
          title: Limit
        description: Rows returned per table
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHitPage'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/domains/{domain}:
    get:
      tags:
      - domains
      summary: Where a domain is licensed, and where it is blocked
      description: A leading `www.` is ignored, and a listed subdomain counts as a match of its parent
        (`nj.bet365.com` for `bet365.com`), marked `subdomain`.
      operationId: getDomainStatus
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          description: A hostname; a URL is accepted and reduced to its host
          examples:
          - bet365.com
          title: Domain
        description: A hostname; a URL is accepted and reduced to its host
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
          title: Jurisdiction
        description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainStatus'
        '400':
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '404':
          description: Unknown identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
