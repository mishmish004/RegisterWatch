openapi: 3.1.0
info:
  title: registerwatch
  description: Gambling regulators' public registers, one schema per register, with history.
  version: 0.2.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Health Health Get
  /registers:
    get:
      tags:
      - health
      summary: List Registers
      operationId: list_registers_registers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                type: array
                title: Response List Registers Registers Get
  /status:
    get:
      tags:
      - health
      summary: Status
      operationId: status_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Status Status Get
  /ingest/{slug}:
    post:
      tags:
      - ingest
      summary: Trigger
      operationId: trigger_ingest__slug__post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      - name: accept_count_delta
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Accept Count Delta
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Wait
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Trigger Ingest  Slug  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ingest/last:
    get:
      tags:
      - ingest
      summary: Last Run
      operationId: last_run_ingest_last_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Last Run Ingest Last Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jurisdictions/{code}/ingest:
    post:
      tags:
      - ingest
      summary: Trigger Jurisdiction
      operationId: trigger_jurisdiction_jurisdictions__code__ingest_post
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      - name: accept_count_delta
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Accept Count Delta
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Wait
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Trigger Jurisdiction Jurisdictions  Code  Ingest Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jurisdictions:
    get:
      tags:
      - read
      summary: List Jurisdictions
      operationId: list_jurisdictions_jurisdictions_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Jurisdictions Jurisdictions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jurisdictions/{code}:
    get:
      tags:
      - read
      summary: Get Jurisdiction
      operationId: get_jurisdiction_jurisdictions__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Jurisdiction Jurisdictions  Code  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jurisdictions/{code}/changes:
    get:
      tags:
      - read
      summary: Get Changes
      operationId: get_changes_jurisdictions__code__changes_get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: ISO date or timestamp
          title: Since
        description: ISO date or timestamp
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Changes Jurisdictions  Code  Changes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jurisdictions/{code}/{slug}/{table}:
    get:
      tags:
      - read
      summary: Get Rows
      description: 'Current rows. Any other query parameter filters a column by exact value,

        e.g. `/jurisdictions/gb/gb_ukgc/licences?status=Active&type=Remote`.'
      operationId: get_rows_jurisdictions__code___slug___table__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: table
        in: path
        required: true
        schema:
          type: string
          title: Table
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Rows Jurisdictions  Code   Slug   Table  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /search:
    get:
      tags:
      - read
      summary: Search
      operationId: search_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          title: Q
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Search Search Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /check/domain/{domain}:
    get:
      tags:
      - read
      summary: Check Domain
      operationId: check_domain_check_domain__domain__get
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          title: Domain
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Jurisdiction
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Check Domain Check Domain  Domain  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
