components:
  schemas:
    Column:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - text
          - date
          - timestamptz
          - int
          - bigint
          - numeric
          - bool
          - text[]
          title: Type
        required:
          type: boolean
          title: Required
          description: Filled in on (nearly) every row of a good snapshot
      type: object
      required:
      - name
      - type
      - required
      title: Column
      examples:
      - name: licence_number
        type: text
        required: true
    DomainMatch:
      properties:
        jurisdiction:
          type: string
          title: Jurisdiction
        register:
          type: string
          title: Register
          description: Register slug, also its Postgres schema
        regulator:
          type: string
          title: Regulator
        kind:
          type: string
          enum:
          - licensees
          - blocklist
          title: Kind
        table:
          type: string
          title: Table
        match:
          type: string
          enum:
          - exact
          - subdomain
          title: Match
          description: '`subdomain`: the row lists a subdomain of the domain'
        row:
          $ref: '#/components/schemas/Row'
      type: object
      required:
      - jurisdiction
      - register
      - regulator
      - kind
      - table
      - match
      - row
      title: DomainMatch
      examples:
      - &id001
        jurisdiction: US-NJ
        register: us_nj_dge
        regulator: New Jersey Division of Gaming Enforcement
        kind: licensees
        table: internet_gaming_sites
        match: subdomain
        row:
          first_seen_at: '2026-10-05T06:01:12Z'
          last_seen_at: '2026-10-07T06:00:41Z'
          values:
            licensee: HARD ROCK HOTEL AND CASINO
            site: nj.bet365.com
            host: nj.bet365.com
            status: authorized
    DomainStatus:
      properties:
        domain:
          type: string
          title: Domain
          description: The hostname checked, lower-cased, without a leading `www.`
        licensed_in:
          items:
            type: string
          type: array
          title: Licensed In
          description: Jurisdictions whose licensee registers list it
        blocked_in:
          items:
            type: string
          type: array
          title: Blocked In
          description: Jurisdictions whose blocklists list it
        matches:
          items:
            $ref: '#/components/schemas/DomainMatch'
          type: array
          title: Matches
      type: object
      required:
      - domain
      - licensed_in
      - blocked_in
      - matches
      title: DomainStatus
      examples:
      - domain: bet365.com
        licensed_in:
        - US-NJ
        blocked_in:
        - CH
        matches:
        - *id001
    Freshness:
      properties:
        last_attempt_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Attempt At
          description: Newest ingest attempt, good or not
        last_good_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Good At
          description: Newest complete snapshot; null if there has never been one
        last_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Reason
          description: Why the newest attempt was incomplete, e.g. `PAGE_GAP:3/4 licences:HTTP_503`; null
            if it was complete
        failed_7d:
          type: integer
          title: Failed 7D
          description: Incomplete attempts in the last 7 days
      type: object
      required:
      - last_attempt_at
      - last_good_at
      - last_reason
      - failed_7d
      title: Freshness
      examples:
