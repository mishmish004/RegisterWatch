components:
  schemas:
    ChangeEvent:
      properties:
        change:
          type: string
          enum:
          - added
          - removed
          title: Change
          description: A changed row is one `removed` and one `added`
        at:
          type: string
          format: date-time
          title: At
          description: When the snapshot that made the change was recorded
        snapshot_id:
          type: integer
          title: Snapshot Id
        register:
          type: string
          title: Register
          description: Register slug, also its Postgres schema
        table:
          type: string
          title: Table
        row:
          $ref: '#/components/schemas/Row'
      type: object
      required:
      - change
      - at
      - snapshot_id
      - register
      - table
      - row
      title: ChangeEvent
      examples:
      - &id001
        change: removed
        at: '2026-10-07T06:00:44Z'
        snapshot_id: 431
        register: gb_ukgc
        table: licences
        row:
          id: 1187
          first_seen_snapshot_id: 412
          first_seen_at: '2026-10-05T06:01:12Z'
          last_seen_at: '2026-10-07T06:00:41Z'
          values:
            account_number: '102'
            licence_number: 000102-N-000000-000
            status: Active
            type: Non-Remote
            activity: Bingo
            start_date: null
            end_date: null
    ChangePage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ChangeEvent'
          type: array
          title: Data
          description: 'Oldest first: by snapshot, then table, row id, change'
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - data
      - pagination
      title: ChangePage
      examples:
      - data:
        - *id001
        pagination:
          next_cursor: eyJwIjp7ImsiOls0MzEsImdiX3VrZ2MiLCJsaWNlbmNlcyIsMTE4NywicmVtb3ZlZCJdfSwicyI6IjEyIn0
          has_more: true
          limit: 1
          total: null
    Column:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - text
          - date
          - timestamptz
          - int
          - bigint
          - numeric
          - bool
          - text[]
          title: Type
        required:
          type: boolean
          title: Required
          description: Filled in on (nearly) every row of a good snapshot
      type: object
      required:
      - name
      - type
      - required
      title: Column
      examples:
      - name: licence_number
        type: text
        required: true
    DomainMatch:
      properties:
        jurisdiction:
          type: string
          title: Jurisdiction
        register:
          type: string
          title: Register
          description: Register slug, also its Postgres schema
        regulator:
          type: string
          title: Regulator
        kind:
          type: string
          enum:
          - licensees
          - blocklist
          title: Kind
        table:
          type: string
          title: Table
        match:
          type: string
          enum:
          - exact
          - subdomain
          title: Match
          description: '`subdomain`: the row lists a subdomain of the domain'
        row:
          $ref: '#/components/schemas/Row'
      type: object
      required:
      - jurisdiction
      - register
      - regulator
      - kind
      - table
      - match
      - row
      title: DomainMatch
      examples:
      - &id002
        jurisdiction: US-NJ
        register: us_nj_dge
        regulator: New Jersey Division of Gaming Enforcement
        kind: licensees
        table: internet_gaming_sites
        match: subdomain
        row:
          id: 9
          first_seen_snapshot_id: 405
          first_seen_at: '2026-10-05T06:01:12Z'
          last_seen_at: '2026-10-07T06:00:41Z'
          values:
            licensee: HARD ROCK HOTEL AND CASINO
            site: nj.bet365.com
            host: nj.bet365.com
            status: authorized
    DomainStatus:
      properties:
        domain:
          type: string
          title: Domain
          description: The hostname checked, lower-cased, without a leading `www.`
        licensed_in:
          items:
            type: string
          type: array
          title: Licensed In
          description: Jurisdictions whose licensee registers list it
        blocked_in:
          items:
            type: string
          type: array
          title: Blocked In
          description: Jurisdictions whose blocklists list it
        matches:
          items:
            $ref: '#/components/schemas/DomainMatch'
          type: array
          title: Matches
      type: object
      required:
      - domain
      - licensed_in
      - blocked_in
      - matches
      title: DomainStatus
      examples:
      - domain: bet365.com
        licensed_in:
        - US-NJ
        blocked_in:
        - CH
        matches:
        - *id002
    Freshness:
      properties:
        last_attempt_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Attempt At
          description: Newest ingest attempt, good or not
        last_good_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Good At
          description: Newest complete snapshot; null if there has never been one
        last_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Reason
          description: Why the newest attempt was incomplete, e.g. `PAGE_GAP:3/4 licences:HTTP_503`; null
            if it was complete
        failed_7d:
          type: integer
          title: Failed 7D
          description: Incomplete attempts in the last 7 days
      type: object
      required:
      - last_attempt_at
      - last_good_at
      - last_reason
      - failed_7d
      title: Freshness
      examples:
      - last_attempt_at: '2026-10-07T06:00:41Z'
        last_good_at: '2026-10-07T06:00:41Z'
        last_reason: null
        failed_7d: 0
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestRun:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - partial
          - failed
          title: Status
          description: '`partial`: some registers incomplete or not started; `failed`: the run itself
            broke'
        requested:
          $ref: '#/components/schemas/IngestRunRequest'
          description: The request as it was received
        registers:
          items:
            type: string
          type: array
          title: Registers
          description: What the request resolved to, in run order
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why the run failed, e.g. `worker lost`
        results:
          items:
            $ref: '#/components/schemas/IngestRunResult'
          type: array
          title: Results
          description: One per register finished, in run order
        not_started:
          items:
            type: string
          type: array
          title: Not Started
          description: Registers the run stopped before (a shutdown)
        url:
          type: string
          title: Url
      type: object
      required:
      - id
      - status
      - requested
      - registers
      - created_at
      - started_at
      - finished_at
      - error
      - results
      - not_started
      - url
      title: IngestRun
      examples:
      - &id003
        id: 0199c1a8-7c3e-7a52-9d1e-5b6f0c2a4e11
        status: partial
        requested:
          registers: null
          jurisdiction: ch
          force: false
          accept_count_delta: false
        registers:
        - ch_esbk
        - ch_gespa
        created_at: '2026-10-07T06:00:00Z'
        started_at: '2026-10-07T06:00:00Z'
        finished_at: '2026-10-07T06:00:19Z'
        error: null
        results:
        - &id004
          register: ch_esbk
          snapshot_id: 431
          complete: true
          skipped: false
          unchanged: false
          reason: null
          record_count: 1532
          finished_at: '2026-10-07T06:00:12Z'
        not_started:
        - ch_gespa
        url: /v1/ingest-runs/0199c1a8-7c3e-7a52-9d1e-5b6f0c2a4e11
    IngestRunPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/IngestRun'
          type: array
          title: Data
          description: Newest first
        pagination:
          $ref: '#/components/schemas/Pagination'
      type: object
      required:
      - data
      - pagination
      title: IngestRunPage
      examples:
      - data:
        - *id003
        pagination:
          next_cursor: null
          has_more: false
          limit: 100
          total: null
    IngestRunRequest:
      properties:
        registers:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 100
            minItems: 1
          - type: 'null'
          title: Registers
          description: Register slugs; not with `jurisdiction`
        jurisdiction:
          anyOf:
          - type: string
            maxLength: 10
          - type: 'null'
          title: Jurisdiction
          description: Every register of one jurisdiction
        force:
          type: boolean
          title: Force
          description: Fetch even when a good snapshot is recent
          default: false
        accept_count_delta:
          type: boolean
          title: Accept Count Delta
          description: Accept a row count far from the last one
          default: false
      additionalProperties: false
      type: object
      title: IngestRunRequest
      description: 'Which registers to ingest: `registers`, or `jurisdiction`, or neither for all.'
      examples:
      - jurisdiction: ch
      - registers:
        - gb_ukgc
        force: true
      - {}
    IngestRunResult:
      properties:
        register:
          type: string
          title: Register
          description: Register slug, also its Postgres schema
        snapshot_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Snapshot Id
          description: The snapshot this run recorded; null if none was
        complete:
          type: boolean
          title: Complete
        skipped:
          type: boolean
          title: Skipped
          description: 'Not fetched: a good snapshot is recent and `force` was not set'
        unchanged:
          type: boolean
          title: Unchanged
          description: Fetched, and identical to the previous snapshot
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why it was not complete
        record_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Record Count
        finished_at:
          type: string
          format: date-time
          title: Finished At
      type: object
      required:
      - register
      - snapshot_id
      - complete
      - skipped
      - unchanged
      - reason
      - record_count
      - finished_at
      title: IngestRunResult
      examples:
      - *id004
    Jurisdiction:
      properties:
        code:
          type: string
          title: Code
          description: ISO 3166-1 alpha-2, or a subdivision such as US-NJ
        name:
