openapi: 3.1.0
info:
  title: registerwatch
  description: Gambling regulators' public registers, one schema per register, with history.
  contact:
    name: registerwatch
    url: https://github.com/mishmish004/RegisterWatch
  license:
    name: All rights reserved
    url: https://choosealicense.com/no-permission/
  version: 0.2.0
servers:
- url: /
  description: The deployment serving this document
paths:
  /v1/jurisdictions:
    get:
      tags:
      - jurisdictions
      summary: List jurisdictions
      operationId: listJurisdictions
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/jurisdictions/{code}:
    get:
      tags:
      - jurisdictions
      summary: Get a jurisdiction with its registers and their freshness
      operationId: getJurisdiction
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
          examples:
          - ch
          title: Code
        description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/jurisdictions/{code}/changes:
    get:
      tags:
      - changes
      summary: Rows added and removed across a jurisdiction's registers, oldest first
      description: Registers interleave by when their snapshots were recorded. Each register's first complete
        snapshot is its baseline, not a change.
      operationId: listJurisdictionChanges
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
          examples:
          - ch
          title: Code
        description: 'Jurisdiction code, any case, `-` or `_`: `gb`, `US-NJ`, `ca_on`'
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only changes recorded at or after this RFC 3339 time, with an offset (`2026-10-01T00:00:00Z`)
          title: Since
        description: Only changes recorded at or after this RFC 3339 time, with an offset (`2026-10-01T00:00:00Z`)
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only changes recorded before this time; after `since`
          title: Until
        description: Only changes recorded before this time; after `since`
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 100
          title: Limit
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers:
    get:
      tags:
      - registers
      summary: List registers
      operationId: listRegisters
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}:
    get:
      tags:
      - registers
      summary: Get a register with its tables and freshness
      operationId: getRegister
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}/tables/{table}:
    get:
      tags:
      - registers
      summary: Get a table's columns
      operationId: getTable
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: table
        in: path
        required: true
        schema:
          type: string
          description: Table name within the register
          examples:
          - licences
          title: Table
        description: Table name within the register
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}/tables/{table}/rows:
    get:
      tags:
      - rows
      summary: List a table's current rows
      description: Rows in `id` order. Every page of one walk is read as of the snapshot the first page
        was, so an ingest during the walk neither repeats nor skips a row.
      operationId: listRows
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: table
        in: path
        required: true
        schema:
          type: string
          description: Table name within the register
          examples:
          - licences
          title: Table
        description: Table name within the register
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 200
          - type: 'null'
          description: Case-insensitive substring in any text column
          title: Q
        description: Case-insensitive substring in any text column
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 100
          title: Limit
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          description: Also count every matching row (slower)
          default: false
          title: Include Total
        description: Also count every matching row (slower)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: filter
        in: query
        style: deepObject
        explode: true
        required: false
        description: Exact match on a column, e.g. `filter[status]=Active&filter[type]=Remote`. Columns
          are listed by getTable; any other column is a 400.
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}/tables/{table}/rows/{id}:
    get:
      tags:
      - rows
      summary: Get one row, current or not, with its history
      operationId: getRow
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: table
        in: path
        required: true
        schema:
          type: string
          description: Table name within the register
          examples:
          - licences
          title: Table
        description: Table name within the register
      - name: id
        in: path
        required: true
        schema:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          description: The row's `id`
          examples:
          - 1187
          title: Id
        description: The row's `id`
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}/changes:
    get:
      tags:
      - changes
      summary: Rows added and removed in a register, oldest first
      description: 'The register''s first complete snapshot is its baseline, not a change. Never truncated:
        follow `next_cursor` until `has_more` is false.'
      operationId: listRegisterChanges
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only changes recorded at or after this RFC 3339 time, with an offset (`2026-10-01T00:00:00Z`)
          title: Since
        description: Only changes recorded at or after this RFC 3339 time, with an offset (`2026-10-01T00:00:00Z`)
      - name: until
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only changes recorded before this time; after `since`
          title: Until
        description: Only changes recorded before this time; after `since`
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 100
          title: Limit
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/registers/{slug}/snapshots:
    get:
      tags:
      - registers
      summary: Every ingest run of a register, complete or not, newest first
      operationId: listSnapshots
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          description: Register slug, e.g. `gb_ukgc`
          examples:
          - gb_ukgc
          title: Slug
        description: Register slug, e.g. `gb_ukgc`
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 100
          title: Limit
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/search:
    get:
      tags:
      - search
      summary: Find text in every register's current rows
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 200
          description: Case-insensitive substring
          title: Q
        description: Case-insensitive substring
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
          title: Jurisdiction
        description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Rows returned per table
          default: 20
          title: Limit
        description: Rows returned per table
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchHitPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/domains/{domain}:
    get:
      tags:
      - domains
      summary: Where a domain is licensed, and where it is blocked
      description: A leading `www.` is ignored, and a listed subdomain counts as a match of its parent
        (`nj.bet365.com` for `bet365.com`), marked `subdomain`.
      operationId: getDomainStatus
      parameters:
      - name: domain
        in: path
        required: true
        schema:
          type: string
          maxLength: 253
          description: A hostname; a URL is accepted and reduced to its host
          examples:
          - bet365.com
          title: Domain
        description: A hostname; a URL is accepted and reduced to its host
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
          title: Jurisdiction
        description: Only these jurisdictions; repeat the parameter for several (`?jurisdiction=gb&jurisdiction=de`)
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/ingest-runs:
    post:
      tags:
      - ingest
      summary: Start an ingest run
      description: 'Answers at once with the run; poll its `url` (also in `Location`). One run at a time
        across every replica: a second is a 409 linking the active one. With `Idempotency-Key`, a repeat
        of the same request within 24 hours returns the original run (200) instead of starting another.'
      operationId: createIngestRun
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          description: Any string you choose, unique per intended run
          title: Idempotency-Key
        description: Any string you choose, unique per intended run
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/IngestRunRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: 'A replay of an earlier request with the same `Idempotency-Key`: the original run'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRun'
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags:
      - ingest
      summary: List ingest runs, newest first
      operationId: listIngestRuns
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size
          default: 100
          title: Limit
        description: Page size
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '`next_cursor` from the previous page'
          title: Cursor
        description: '`next_cursor` from the previous page'
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRunPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/ingest-runs/{id}:
    get:
      tags:
      - ingest
      summary: Get one ingest run
      operationId: getIngestRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: The run's id, from its `url`
          title: Id
        description: The run's id, from its `url`
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
